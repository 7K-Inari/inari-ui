replicaCount: 1
bundle:
  repository: ghcr.io/7k-inari/inari-ui-bundle
  tag: 2.1.0
keycloakUrl: http://localhost:8080
keycloakRealm: inari
keycloakClientId: inari-ui
apiBaseUrl: /api/v1
nginx:
  corsOrigins:
    - https://example.org
    - https://auth.example.org
image:
  orasRepository: ghcr.io/oras-project/oras
  orasTag: v1.3.0
  nginxRepository: nginx
  nginxTag: 1.27-alpine
livenessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
pdb:
  enabled: true
  minAvailable: 1
affinity: {}
topologySpreadConstraints: []
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
service:
  type: ClusterIP
  port: 80
gateway:
  name: ''
  namespace: ''
  sectionName: ''
route:
  enabled: false
  hostnames: []
  pathPrefix: ''
  annotations: {}
