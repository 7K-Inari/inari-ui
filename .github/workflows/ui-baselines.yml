name: UI baselines

# Visual baselines are CI-authoritative: text rendering differs subtly across
# machines, so snapshots are generated on the CI runner image. When a PR
# intentionally changes visuals, run this workflow against the PR branch
# (Actions → "UI baselines" → Run workflow → pick the branch); it regenerates
# snapshots and commits them back to the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui:update
      - name: commit updated baselines
        run: |
          set -euo pipefail
          if git diff --quiet tests/ui/; then
            echo "baselines unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/
          git commit -m "test: regenerate UI visual baselines [skip ci]"
          git push
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-baselines
          path: tests/ui/usability.spec.ts-snapshots/
          retention-days: 30
