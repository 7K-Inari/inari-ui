name: UI baselines

# Visual baselines are CI-authoritative: text rendering differs subtly across
# machines, so snapshots are generated on the CI runner image. When a PR
# intentionally changes visuals, run this workflow against the PR branch
# (Actions → "UI baselines" → Run workflow → pick the branch); it regenerates
# snapshots and commits them back to the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui:update
      - name: commit updated baselines
        run: |
          set -euo pipefail
          if git diff --quiet tests/ui/; then
            echo "baselines unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/
          git commit -m "test: regenerate UI visual baselines [skip ci]"
          git push
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ui-baselines
          path: tests/ui/usability.spec.ts-snapshots/
          retention-days: 30
