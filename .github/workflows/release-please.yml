name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Skip on release merges
        id: gate
        # release.yml creates the tag asynchronously on the same push; without
        # this guard, recomputing now would re-propose the just-released
        # commits with a bumped version (duplicate changelog) — the
        # version-drift loop. On the next ordinary push the tag exists and the
        # computation is correct.
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          parent2=""
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            parent2="$(git log -1 --pretty=%s HEAD^2)"
          fi
          if echo "$msg" | grep -qiE '^chore(\(.*\))?: release' \
             || echo "$parent2" | grep -qiE '^chore(\(.*\))?: release'; then
            echo "release merge detected ($msg) — skipping release-please"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: googleapis/release-please-action@v4
        with:
          # Manifest mode is required: the defaults load release-please-config.json,
          # which carries the per-package config (chart component, extra-files).
          # Passing `release-type` instead would put the action in single-package
          # mode, silently ignoring the config — extra-files (chart appVersion,
          # values.yaml bundle.tag) would never reach the Release PR.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Create/update the Release PR only; tags + GitHub Releases are
          # created by release.yml when the PR merges.
          skip-github-release: true
