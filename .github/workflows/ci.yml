name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      # The bundle artifact name is load-bearing: the chart's init container
      # untars /work/inari-ui-bundle.tar.gz and inari-server pulls the OCI
      # layer by name. Guard the exact name here so publish.yml can't drift.
      - name: package bundle
        run: tar -czf inari-ui-bundle.tar.gz -C dist . && test -f inari-ui-bundle.tar.gz
      - name: assert publish.yml uses the exact bundle name
        run: |
          grep -q 'tar -czf inari-ui-bundle.tar.gz' .github/workflows/publish.yml \
            && grep -q 'inari-ui-bundle.tar.gz:application/vnd.inari.ui.bundle.v1.tar+gzip' .github/workflows/publish.yml \
            || (echo '::error::bundle artifact must be named exactly inari-ui-bundle.tar.gz in publish.yml'; exit 1)

  # Contract drift check: regenerate the TypeScript client types from the
  # pinned OpenAPI snapshot and fail if the committed output differs. This
  # catches hand-edits of generated code (or a forgotten sync) — the class
  # of drift behind production 422s like "unexpected property".
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: regenerate types from pinned spec
        run: npm run codegen
      - name: fail on uncommitted generated diff
        run: git diff --exit-code src/api/__generated__/ || (echo '::error::generated types out of sync — run npm run sync:api (or npm run codegen) and commit the result'; exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: inari-ui-bundle
          path: dist/
