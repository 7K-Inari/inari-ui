name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: inari-ui-bundle
          path: dist/

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0
        with:
          version: v3.12.0
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.8.2
      - name: helm lint
        run: helm lint charts/inari-console
      - name: ct lint
        run: ct lint --config ct.yaml --validate-maintainers=false
      - name: helm unittest
        run: helm unittest charts/inari-console
      - name: Global image values render check
        # Fails if any rendered image ignores global.imageRegistry or any
        # workload pod spec ignores global.imagePullSecrets (plan §4.2).
        run: scripts/check-global-image-values.sh charts/inari-console
