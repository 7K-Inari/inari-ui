name: CI

on:
  pull_request:
  # Manual retrigger: GitHub occasionally drops pull_request synchronize events.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      # The bundle artifact contract is load-bearing: the chart's init
      # container untars /work/inari-ui-bundle.tar.gz, inari-server pulls the
      # OCI layer by name, and Harbor only scans artifacts whose manifest
      # config media type is a valid image config (Type=IMAGE). Both push
      # sites must go through scripts/push-oci-bundle.sh, which keeps the
      # custom layer media type and adds the image config. Guard all of it
      # here so the workflows can't drift.
      - name: package bundle
        run: tar -czf inari-ui-bundle.tar.gz -C dist . && test -f inari-ui-bundle.tar.gz
      - name: assert bundle push contract
        run: |
          grep -q 'tar -czf inari-ui-bundle.tar.gz' .github/workflows/publish.yml \
            && grep -qF 'inari-ui-bundle.tar.gz' scripts/push-oci-bundle.sh \
            && grep -qF 'application/vnd.inari.ui.bundle.v1.tar+gzip' scripts/push-oci-bundle.sh \
            && grep -qF 'application/vnd.oci.image.config.v1+json' scripts/push-oci-bundle.sh \
            && grep -q 'scripts/push-oci-bundle.sh' .github/workflows/publish.yml \
            && grep -q 'scripts/push-oci-bundle.sh' .github/workflows/edge.yml \
            || (echo '::error::bundle push contract broken — publish.yml/edge.yml must push inari-ui-bundle.tar.gz via scripts/push-oci-bundle.sh (custom layer media type + OCI image config media type are required)'; exit 1)

  # Contract drift check: regenerate the TypeScript client types from the
  # pinned OpenAPI snapshot and fail if the committed output differs. This
  # catches hand-edits of generated code (or a forgotten sync) — the class
  # of drift behind production 422s like "unexpected property".
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: regenerate types from pinned spec
        run: npm run codegen
      - name: fail on uncommitted generated diff
        run: git diff --exit-code src/api/__generated__/ || (echo '::error::generated types out of sync — run npm run sync:api (or npm run codegen) and commit the result'; exit 1)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: inari-ui-bundle
          path: dist/

  # Usability UI tests: axe a11y + visual regression + responsive overflow and
  # tap targets, in Chromium against the mocked API and mock auth. Functional
  # e2e lives in the release bundle; this job guards usability only.
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: usability UI tests
        run: npm run test:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: ui-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
