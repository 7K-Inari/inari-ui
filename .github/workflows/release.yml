name: release

# Detects a merged Release PR (release-please action self-detection — robust
# under merge-commit and squash alike), creates tag + GitHub Release, then
# runs the publish jobs gated on the action's outputs. No tag-push triggers,
# no manual releases.
#
# Sole release-please detector on push to main. The Helm chart lives in
# 7K-Inari/inari-release-bundle now — chart versioning/publishing happens
# there; this workflow only notifies it (chart-sync job) after a release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    # Repair path (still workflow-driven): re-publish the bundle and all
    # charts for an already-tagged version whose publish jobs failed or were
    # skipped, e.g. after fixing the pipeline.
    inputs:
      version:
        description: 'Already-released version to (re)publish, e.g. 1.6.0'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      paths_released: ${{ steps.rp.outputs.paths_released }}
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # Contract gate: a UI release ships against a released server spec, so the
  # pin must be a real server version (not edge/main-*) and the snapshot must
  # cover that exact artifact's paths. Runs only on the release path; the
  # workflow_dispatch repair path re-publishes already-tagged, frozen code and
  # must not be blocked here.
  contract-gate:
    needs: release
    if: github.event_name == 'push' && needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
      - uses: mikefarah/yq@v4.44.3

      - name: assert pin is a released server version
        run: |
          pin=$(node -p "require('./package.json').inariServerSpecVersion || ''")
          if [ -z "$pin" ] || [ "$pin" = "edge" ] || [ "${pin#main-}" != "$pin" ]; then
            echo "::error::release blocked: inariServerSpecVersion is '$pin' — pin a released server spec version first (npm run sync:api -- <X.Y.Z>)"
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_ENV"

      - name: assert snapshot covers the pinned server spec
        run: ./scripts/check-api-drift.sh "$pin"

  publish:
    needs: [release, contract-gate]
    if: always() && (github.event_name == 'workflow_dispatch' || (needs.release.outputs.release_created == 'true' && needs.contract-gate.result == 'success'))
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # The chart lives in 7K-Inari/inari-release-bundle now: notify it so its
  # chart-sync workflow bumps charts/inari-console appVersion + bundle.tag
  # (chart releases in lockstep via release-please there). Best-effort: a
  # failed dispatch is repairable via the bundle repo's chart-sync
  # workflow_dispatch.
  chart-sync:
    needs: [release, contract-gate, publish]
    if: always() && (github.event_name == 'workflow_dispatch' || (needs.release.outputs.release_created == 'true' && needs.contract-gate.result == 'success')) && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch appversion-bump to inari-release-bundle
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release.outputs.version }}
        run: |
          test -n "$VERSION" || { echo "::error::no version resolved"; exit 1; }
          gh api repos/7K-Inari/inari-release-bundle/dispatches \
            -f event_type=appversion-bump \
            -F "client_payload[chart]=inari-console" \
            -F "client_payload[version]=${VERSION}"
