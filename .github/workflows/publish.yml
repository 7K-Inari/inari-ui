name: publish

on:
  workflow_call:
    inputs:
      version:
        description: Semver version to publish (e.g. 0.2.1), without leading v
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/7k-inari/inari-ui-bundle

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: package bundle
        run: tar -czf inari-ui-bundle.tar.gz -C dist .

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: push bundle to GHCR
        id: push
        run: |
          major_minor="${VERSION%.*}"
          for tag in "${VERSION}" "${major_minor}" "latest"; do
            out="$(oras push "${IMAGE}:${tag}" \
              inari-ui-bundle.tar.gz:application/vnd.inari.ui.bundle.v1.tar+gzip)"
            echo "${out}"
            if [ "${tag}" = "${VERSION}" ]; then
              echo "digest=$(echo "${out}" | grep -oE 'sha256:[a-f0-9]{64}' | tail -1)" >> "$GITHUB_OUTPUT"
            fi
          done
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ inputs.version }}

      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./dist
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: sign bundle (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: attest SBOM
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: attest SLSA provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
