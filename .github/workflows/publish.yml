name: publish

on:
  workflow_call:
    inputs:
      version:
        description: Semver version to publish (e.g. 0.2.1), without leading v
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/7k-inari/inari-ui-bundle

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: package bundle
        run: tar -czf inari-ui-bundle.tar.gz -C dist .

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oras-project/setup-oras@v1

      - name: push bundle to GHCR
        id: push
        run: |
          major_minor="${VERSION%.*}"
          for tag in "${VERSION}" "${major_minor}" "latest"; do
            out="$(oras push "${IMAGE}:${tag}" \
              inari-ui-bundle.tar.gz:application/vnd.inari.ui.bundle.v1.tar+gzip)"
            echo "${out}"
            if [ "${tag}" = "${VERSION}" ]; then
              echo "digest=$(echo "${out}" | grep -oE 'sha256:[a-f0-9]{64}' | tail -1)" >> "$GITHUB_OUTPUT"
            fi
          done
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ inputs.version }}

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./dist
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: sigstore/cosign-installer@v3

      - name: sign bundle (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: attest SBOM
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: attest SLSA provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
