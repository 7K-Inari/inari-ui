name: publish

on:
  workflow_call:
    inputs:
      version:
        description: Semver version to publish (e.g. 0.2.1), without leading v
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/7k-inari/inari-ui-bundle

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: package bundle
        run: tar -czf inari-ui-bundle.tar.gz -C dist .

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2

      - name: push bundle to GHCR
        id: push
        run: |
          major_minor="${VERSION%.*}"
          for tag in "${VERSION}" "${major_minor}" "latest"; do
            out="$(oras push "${IMAGE}:${tag}" \
              inari-ui-bundle.tar.gz:application/vnd.inari.ui.bundle.v1.tar+gzip)"
            echo "${out}"
            if [ "${tag}" = "${VERSION}" ]; then
              echo "digest=$(echo "${out}" | grep -oE 'sha256:[a-f0-9]{64}' | tail -1)" >> "$GITHUB_OUTPUT"
            fi
          done
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ inputs.version }}

      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./dist
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign bundle (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: attest SBOM
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: attest SLSA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
