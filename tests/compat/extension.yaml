apiVersion: inari.io/v1alpha1
kind: Extension
metadata:
  name: contract-fixture
spec:
  version: 0.1.0
  kinds: [ui]
  ui:
    remoteEntry: http://127.0.0.1:8080/remoteEntry.js
    slots:
      - { kind: nav-item, name: contract-nav }
      - { kind: catalog-card, name: contract-card }
      - { kind: cluster-tab, name: contract-tab }
      - { kind: instance-action, name: contract-action }
      - { kind: form-widget, name: contract-picker }
      - { kind: page, name: contract-page }
  contracts:
    ui:
      sdk: ">=0.1.8 <2.0.0"
      hostApi: inari.ui.v1
  permissions:
    - extensions:invoke:contract-fixture
