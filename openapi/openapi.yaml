components:
  schemas:
    AWSSMProvider:
      additionalProperties: false
      properties:
        authSecretRef:
          $ref: "#/components/schemas/SecretRef"
        region:
          type: string
      required:
        - region
        - authSecretRef
      type: object
    AccessInfoOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AccessInfoOutputBody.json
          format: uri
          readOnly: true
          type: string
        accessInfo:
          $ref: "#/components/schemas/ClusterAccessInfo"
      required:
        - accessInfo
      type: object
    AccountOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AccountOutputBody.json
          format: uri
          readOnly: true
          type: string
        account:
          $ref: "#/components/schemas/CloudAccount"
      required:
        - account
      type: object
    AddMemberInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddMemberInputBody.json
          format: uri
          readOnly: true
          type: string
        subject:
          description: Keycloak user id
          minLength: 1
          type: string
      required:
        - subject
      type: object
    AgentChannel:
      additionalProperties: false
      properties:
        channel:
          type: string
        clusterSetId:
          type: string
        createdAt:
          format: date-time
          type: string
        desiredAgentVersion:
          type: string
        id:
          type: string
        orgId:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - orgId
        - clusterSetId
        - channel
        - desiredAgentVersion
        - createdAt
        - updatedAt
      type: object
    ApprovalConfig:
      additionalProperties: false
      properties:
        approvalTtl:
          type: string
        approverGroups:
          items:
            $ref: "#/components/schemas/ApproverGroup"
          type:
            - array
            - "null"
        autoApprove:
          items:
            $ref: "#/components/schemas/AutoApproveRule"
          type:
            - array
            - "null"
        defaultPolicy:
          type: string
        thresholds:
          items:
            $ref: "#/components/schemas/ApprovalThreshold"
          type:
            - array
            - "null"
      required:
        - defaultPolicy
        - approvalTtl
      type: object
    ApprovalOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApprovalOutputBody.json
          format: uri
          readOnly: true
          type: string
        approval:
          $ref: "#/components/schemas/ApprovalRequest"
      required:
        - approval
      type: object
    ApprovalRequest:
      additionalProperties: false
      properties:
        action:
          type: string
        approver:
          type: string
        cancelledBy:
          type: string
        channel:
          type: string
        clusterId:
          type: string
        createdAt:
          format: date-time
          type: string
        decidedAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        instanceId:
          type: string
        itemId:
          type: string
        name:
          type: string
        namespace:
          type: string
        orgId:
          type: string
        ownerTeam:
          type: string
        reason:
          type: string
        requester:
          type: string
        spec: {}
        state:
          type: string
        version:
          type: string
      required:
        - id
        - orgId
        - itemId
        - version
        - clusterId
        - spec
        - requester
        - state
        - createdAt
      type: object
    ApprovalThreshold:
      additionalProperties: false
      properties:
        gt:
          format: double
          type: number
        kind:
          type: string
        policy:
          type: string
      required:
        - kind
        - gt
        - policy
      type: object
    ApproverGroup:
      additionalProperties: false
      properties:
        name:
          type: string
        subjects:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
        - subjects
      type: object
    AssignPackInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AssignPackInputBody.json
          format: uri
          readOnly: true
          type: string
        targetId:
          type: string
        targetType:
          description: clusterset | tenant | cluster
          type: string
      required:
        - targetType
        - targetId
      type: object
    AssignPackOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AssignPackOutputBody.json
          format: uri
          readOnly: true
          type: string
        assignment:
          $ref: "#/components/schemas/PolicyAssignment"
      required:
        - assignment
      type: object
    AuditEvent:
      additionalProperties: false
      properties:
