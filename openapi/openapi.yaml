            - https://example.com/schemas/CreatePolicyInputBody.json
          format: uri
          readOnly: true
          type: string
        engine:
          description: rego
          type: string
        name:
          type: string
        source:
          description: Rego source (package inari.policy)
          type: string
        target:
          description: request | render
          type: string
      required:
        - name
        - target
        - engine
        - source
      type: object
    CreateRolloutInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateRolloutInputBody.json
          format: uri
          readOnly: true
          type: string
        desiredVersion:
          type: string
        kind:
          description: capability | policy_pack | agent_upgrade | catalog_version
          type: string
        name:
          type: string
        stages:
          items:
            $ref: "#/components/schemas/RolloutStage"
          type:
            - array
            - "null"
        targetRef:
          type: string
      required:
        - name
        - kind
        - targetRef
        - desiredVersion
        - stages
      type: object
    CreateRunInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateRunInputBody.json
          format: uri
          readOnly: true
          type: string
        displayName:
          type: string
        values:
          additionalProperties: {}
          type: object
        version:
          description: Template version; defaults to the tenant's effective version
          type: string
      required:
        - values
      type: object
    CreateRunOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateRunOutputBody.json
          format: uri
          readOnly: true
