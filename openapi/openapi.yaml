      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClusterOutputBody.json
          format: uri
          readOnly: true
          type: string
        cluster:
          $ref: "#/components/schemas/Cluster"
        kubectlProxyEnabled:
          type: boolean
      required:
        - cluster
        - kubectlProxyEnabled
      type: object
    ClusterSet:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        labelSelector:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        orgId:
          type: string
      required:
        - id
        - orgId
        - name
        - labelSelector
        - createdAt
      type: object
    ClusterSetOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClusterSetOutputBody.json
          format: uri
          readOnly: true
          type: string
        clusterSet:
          $ref: "#/components/schemas/ClusterSet"
      required:
        - clusterSet
      type: object
    ConfigOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConfigOutputBody.json
          format: uri
          readOnly: true
          type: string
        config:
          $ref: "#/components/schemas/ApprovalConfig"
        orgId:
          type: string
        updatedAt:
          format: date-time
          type:
            - string
            - "null"
      required:
        - config
        - orgId
        - updatedAt
      type: object
    CreateBrokeredIdPInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateBrokeredIdPInputBody.json
          format: uri
          readOnly: true
          type: string
        alias:
          description: URL-safe IdP alias (KC alias becomes org-<org>-<alias>)
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
        claimMapping:
          $ref: "#/components/schemas/ClaimMappingInput"
        clientId:
          minLength: 1
          type: string
        clientSecret:
          description: "Write-only: forwarded to Keycloak, never stored or returned"
          minLength: 1
          type: string
        domainHints:
          description: Org email domains used for home-IdP discovery
          items:
            type: string
          type:
            - array
            - "null"
        issuerUrl:
          description: OIDC issuer URL (https); discovered via the discovery endpoint
          minLength: 1
          type: string
      required:
        - alias
        - issuerUrl
        - clientId
        - clientSecret
      type: object
    CreateClusterInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateClusterInputBody.json
          format: uri
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
      type: object
    CreateClusterSetInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateClusterSetInputBody.json
          format: uri
          readOnly: true
          type: string
        labelSelector:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
      required:
        - name
        - labelSelector
      type: object
    CreateIdentityClientInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateIdentityClientInputBody.json
          format: uri
          readOnly: true
          type: string
        audiences:
          items:
            type: string
          type:
            - array
            - "null"
        name:
          description: URL-safe client name (clientId becomes org-<org>-<name>)
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
        redirectUris:
          items:
            type: string
          type:
            - array
            - "null"
        scopes:
          items:
            type: string
          type:
            - array
            - "null"
        type:
          description: service = confidential client-credentials; public = browser/native with redirect URIs
          enum:
            - service
            - public
          type: string
      required:
        - name
        - type
      type: object
    CreateIdentityClientOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateIdentityClientOutputBody.json
          format: uri
          readOnly: true
          type: string
        client:
          $ref: "#/components/schemas/IdentityClient"
        secret:
          description: Returned exactly once; never stored server-side
          type: string
      required:
        - client
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateInputBody.json
          format: uri
          readOnly: true
          type: string
        enabled:
          type: boolean
        events:
          description: Empty = all events
          items:
            type: string
          type:
            - array
            - "null"
        kind:
          description: slack | webhook
          type: string
        name:
          type: string
        secret:
          type: string
        url:
          type: string
      required:
        - name
        - kind
        - url
      type: object
    CreateInputBody1:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateInputBody1.json
          format: uri
          readOnly: true
          type: string
        name:
          type: string
        provider:
