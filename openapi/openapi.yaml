        scope:
          type: string
        targets:
          $ref: "#/components/schemas/SecretStoreTargets"
      required:
        - name
        - scope
        - targets
        - provider
      type: object
    CreatePackInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreatePackInputBody.json
          format: uri
          readOnly: true
          type: string
        engine:
          description: kyverno | cel-vap
          type: string
        manifests: {}
        name:
          type: string
        ociRef:
          type: string
        parameters: {}
        version:
          type: string
      required:
        - name
