        - templateId
        - name
        - parameters
      type: object
    CreateScaffoldOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateScaffoldOutputBody.json
          format: uri
          readOnly: true
          type: string
