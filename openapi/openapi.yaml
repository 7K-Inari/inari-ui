        createdAt:
          format: date-time
          type: string
        id:
          type: string
        impersonator:
          type: string
        objectId:
          type: string
        objectType:
          type: string
        orgId:
          type: string
        payload: {}
      required:
        - id
        - orgId
        - actor
        - action
        - objectType
        - objectId
        - createdAt
      type: object
    AutoApproveRule:
      additionalProperties: false
      properties:
        itemIds:
          items:
            type: string
          type:
            - array
            - "null"
        kind:
          type: string
      required:
        - kind
        - itemIds
      type: object
    AzureKVProvider:
      additionalProperties: false
      properties:
        authSecretRef:
          $ref: "#/components/schemas/SecretRef"
        tenantId:
          type: string
        vaultUrl:
          type: string
      required:
        - vaultUrl
        - authSecretRef
      type: object
    BrokeredIdP:
      additionalProperties: false
      properties:
        alias:
          type: string
        claimMapping:
          $ref: "#/components/schemas/IdPClaimMapping"
        clientId:
          type: string
        createdAt:
          format: date-time
          type: string
        domainHints:
          items:
            type: string
          type:
            - array
            - "null"
        issuerUrl:
          type: string
      required:
        - alias
        - issuerUrl
        - clientId
        - claimMapping
        - domainHints
        - createdAt
      type: object
    BrokeredIdPOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BrokeredIdPOutputBody.json
          format: uri
          readOnly: true
          type: string
        provider:
          $ref: "#/components/schemas/BrokeredIdP"
      required:
        - provider
      type: object
    BulkAssignPolicyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BulkAssignPolicyInputBody.json
          format: uri
          readOnly: true
          type: string
        clusterSetIds:
          items:
            type: string
          type:
            - array
            - "null"
        packId:
          type: string
      required:
        - packId
        - clusterSetIds
      type: object
    BulkDecideInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BulkDecideInputBody.json
          format: uri
          readOnly: true
          type: string
        approvalIds:
          items:
            type: string
          type:
            - array
            - "null"
        approve:
          type: boolean
        reason:
          type: string
      required:
        - approvalIds
        - approve
      type: object
    BulkItemResult:
      additionalProperties: false
      properties:
        error:
          type: string
        id:
          type: string
        ok:
          type: boolean
      required:
        - id
        - ok
      type: object
    BulkPinCatalogInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BulkPinCatalogInputBody.json
          format: uri
          readOnly: true
          type: string
        itemIds:
          items:
            type: string
          type:
            - array
            - "null"
        version:
          type: string
      required:
        - itemIds
        - version
      type: object
    BulkQueryInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BulkQueryInputBody.json
          format: uri
          readOnly: true
          type: string
        labelSelector:
          additionalProperties:
            type: string
          type: object
      required:
        - labelSelector
      type: object
    BulkResultsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BulkResultsOutputBody.json
          format: uri
          readOnly: true
          type: string
        results:
          items:
            $ref: "#/components/schemas/BulkItemResult"
          type:
            - array
            - "null"
      required:
        - results
      type: object
    Capability:
      additionalProperties: false
      properties:
        clusterId:
          type: string
        deletedAt:
          format: date-time
          type: string
        firstSeenAt:
          format: date-time
          type: string
        group:
          type: string
        id:
          type: string
        kind:
          type: string
        lastSeenAt:
          format: date-time
          type: string
        managementMode:
          type: string
        name:
          type: string
        schema: {}
        uiHints: {}
        version:
          type: string
      required:
        - id
        - clusterId
        - kind
        - name
        - managementMode
        - firstSeenAt
        - lastSeenAt
      type: object
    CapabilityRef:
      additionalProperties: false
      properties:
        group:
          type: string
        kind:
          type: string
        name:
          type: string
      required:
        - kind
        - name
      type: object
    CatalogItemVersion:
      additionalProperties: false
      properties:
        channel:
          type: string
        id:
          type: string
        itemId:
          type: string
        payload: {}
        schema: {}
        uiHints: {}
        version:
          type: string
      required:
        - id
        - itemId
        - version
        - channel
      type: object
    ChannelOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChannelOutputBody.json
          format: uri
          readOnly: true
          type: string
        channel:
          $ref: "#/components/schemas/AgentChannel"
      required:
        - channel
      type: object
    ClaimMappingInput:
      additionalProperties: false
      properties:
        email:
          description: Claim carrying the user email (defaults to the IdP's standard mapping)
          type: string
        groups:
          description: Claim carrying group memberships, mapped into the tenant members group
          type: string
      type: object
    CloudAccount:
      additionalProperties: false
      properties:
        accountId:
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          type: string
        externalId:
          type: string
        id:
          type: string
        issuerUrl:
          type: string
        orgId:
          type: string
        provider:
          type: string
        roleArn:
          type: string
        runContext:
          type: string
        state:
          type: string
        validatedAt:
          format: date-time
          type: string
        validationError:
          type: string
      required:
        - id
        - orgId
        - provider
        - accountId
        - roleArn
        - runContext
        - state
        - createdAt
      type: object
    Cluster:
      additionalProperties: false
      properties:
        capabilityChecksum:
          type: string
        connectedAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        distribution:
          type: string
        id:
          type: string
        keycloakClientId:
          type: string
        kubectlProxyDisabled:
          type: boolean
        kubernetesVersion:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        lastSeenAt:
          format: date-time
          type: string
        name:
          type: string
        oidcIssuerUrl:
          type: string
        orgId:
          type: string
        state:
          type: string
      required:
        - id
        - orgId
        - name
        - state
        - kubectlProxyDisabled
        - createdAt
      type: object
    ClusterAccessInfo:
      additionalProperties: false
      properties:
        audience:
          type: string
        issuerUrl:
          type: string
        kubectlClientId:
          type: string
        organization:
          type: string
      required:
        - issuerUrl
        - kubectlClientId
        - audience
        - organization
      type: object
