          examples:
            - https://example.com/schemas/UpdateConfigInputBody.json
          format: uri
          readOnly: true
          type: string
        config:
          $ref: "#/components/schemas/ApprovalConfig"
      required:
        - config
      type: object
    UpdateIdentityClientInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateIdentityClientInputBody.json
          format: uri
          readOnly: true
          type: string
        audiences:
          items:
            type: string
          type: array
        name:
          maxLength: 63
          minLength: 1
          type: string
        redirectUris:
          items:
            type: string
          type: array
        scopes:
          items:
            type: string
          type: array
      type: object
    UpdateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateInputBody.json
          format: uri
          readOnly: true
          type: string
        enabled:
          type: boolean
        events:
          items:
            type: string
          type:
            - array
            - "null"
        name:
          type: string
        secret:
          type: string
        url:
          type: string
      type: object
    UpdateInputBody1:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateInputBody1.json
          format: uri
          readOnly: true
          type: string
        provider:
          $ref: "#/components/schemas/SecretStoreProvider"
        targets:
          $ref: "#/components/schemas/SecretStoreTargets"
      type: object
    UpdatePolicyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdatePolicyInputBody.json
          format: uri
          readOnly: true
          type: string
        enabled:
          type: boolean
        name:
          description: New policy name (empty keeps the current name; 409 on conflict)
          type: string
        source:
          type: string
        target:
          description: request | render (empty keeps the current target)
          type: string
      required:
        - source
        - enabled
      type: object
    UpdateTeamInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateTeamInputBody.json
          format: uri
          readOnly: true
          type: string
        displayName:
          description: Human-friendly display name (name and Keycloak group path stay immutable)
          maxLength: 200
          type: string
      required:
        - displayName
      type: object
    UpdateTenantInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateTenantInputBody.json
          format: uri
          readOnly: true
          type: string
        displayName:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - displayName
      type: object
    UpgradeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpgradeInputBody.json
          format: uri
          readOnly: true
          type: string
        toVersion:
          minLength: 1
          type: string
      required:
        - toVersion
      type: object
    VaultProvider:
      additionalProperties: false
      properties:
        authSecretRef:
          $ref: "#/components/schemas/SecretRef"
        path:
          type: string
        server:
          type: string
      required:
        - server
        - authSecretRef
      type: object
    VisibilityInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/VisibilityInputBody.json
          format: uri
          readOnly: true
          type: string
        rules:
          items:
            $ref: "#/components/schemas/Item"
          type:
            - array
            - "null"
      required:
        - rules
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: inari-server
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/admin/catalog/sync:
    post:
      operationId: syncCatalog
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Sync curated packages from the catalog registry (platform engineer)
  /api/v1/admin/catalog/{item}/visibility:
    put:
      operationId: setCatalogVisibility
      parameters:
        - in: path
          name: item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisibilityInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Set per-tenant/cluster visibility rules (platform engineer)
  /api/v1/approvals/inbox:
    get:
      operationId: inboxApprovals
      parameters:
        - description: Max items to return (default 50, max 200)
          explode: false
          in: query
          name: limit
          schema:
            description: Max items to return (default 50, max 200)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List pending approvals across all orgs the caller belongs to
  /api/v1/features:
    get:
      operationId: getFeatures
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Global feature flags for the console (kubectl-proxy e2e access)
  /api/v1/me/permissions:
    get:
      operationId: getMyPermissions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPermissionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Platform-level permissions of the authenticated caller
  /api/v1/tenants:
    get:
      operationId: listTenants
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTenantsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List tenants visible to the caller (tenant switcher)
    post:
      operationId: createTenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Create a tenant (Keycloak Organization + default teams)
  /api/v1/tenants/{org}:
    delete:
      operationId: deleteTenant
      parameters:
        - description: Tenant slug
          in: path
          name: org
          required: true
          schema:
            description: Tenant slug
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteTenantInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTenantOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Decommission a tenant (org admin only; approval-gated, asynchronous)
    get:
      operationId: getTenant
      parameters:
        - description: Tenant slug
          in: path
          name: org
          required: true
          schema:
            description: Tenant slug
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a tenant by slug
    patch:
      operationId: updateTenant
      parameters:
        - description: Tenant slug
          in: path
          name: org
          required: true
          schema:
            description: Tenant slug
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Update the tenant profile (org admin only)
  /api/v1/tenants/{org}/agent-channels:
    get:
      operationId: listAgentChannels
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChannelsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List agent channel pins
  /api/v1/tenants/{org}/approval-config:
    get:
      operationId: getApprovalConfig
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get the org's effective approval policy config
    put:
      operationId: updateApprovalConfig
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConfigInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Replace the org's approval policy config
  /api/v1/tenants/{org}/approvals:
    get:
      operationId: listApprovals
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - description: Filter by state (pending|approved|rejected|cancelled|expired)
          explode: false
          in: query
          name: state
          schema:
            description: Filter by state (pending|approved|rejected|cancelled|expired)
            type: string
        - description: Pass 'me' for the caller's own requests (inbox filter)
          explode: false
          in: query
          name: requester
          schema:
            description: Pass 'me' for the caller's own requests (inbox filter)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: "List approval requests (default: pending)"
  /api/v1/tenants/{org}/approvals/{id}:
    get:
      operationId: getApproval
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get one approval request
  /api/v1/tenants/{org}/approvals/{id}/cancel:
    post:
      operationId: cancelApproval
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Withdraw a pending approval request (requester only)
  /api/v1/tenants/{org}/approvals/{id}/decide:
    post:
      operationId: decideApproval
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Approve or reject a pending approval request
  /api/v1/tenants/{org}/audit:
    get:
      operationId: listAuditLog
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: actor
          schema:
            type: string
        - explode: false
          in: query
          name: action
          schema:
            type: string
        - explode: false
          in: query
          name: objectType
          schema:
            type: string
        - explode: false
          in: query
          name: from
          schema:
            type: string
        - explode: false
          in: query
          name: to
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuditUIOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Org audit log in the console's shape (filterable by actor/action/objectType/from/to)
  /api/v1/tenants/{org}/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - description: Exact action filter, e.g. cluster.created
          explode: false
          in: query
          name: action
          schema:
            description: Exact action filter, e.g. cluster.created
            type: string
        - description: Exact actor (subject) filter
          explode: false
          in: query
          name: actor
          schema:
            description: Exact actor (subject) filter
            type: string
        - description: Max events to return (default 100, max 500)
          explode: false
          in: query
          name: limit
          schema:
            description: Max events to return (default 100, max 500)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEventsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List org audit events, newest first (filterable by action and actor)
  /api/v1/tenants/{org}/audit/export:
    get:
      operationId: exportAuditLog
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: actor
          schema:
            type: string
        - explode: false
          in: query
          name: action
          schema:
            type: string
        - explode: false
          in: query
          name: objectType
          schema:
            type: string
        - explode: false
          in: query
          name: from
          schema:
            type: string
        - explode: false
          in: query
          name: to
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                contentEncoding: base64
                type: string
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Org audit log as CSV (same filters as the list)
  /api/v1/tenants/{org}/authz/self/extensions:
    get:
      operationId: selfExtensionPermissions
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfPermissionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List the caller's effective extension invoke permissions
  /api/v1/tenants/{org}/bulk/approvals:decide:
    post:
      operationId: bulkDecideApprovals
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDecideInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Bulk approve/reject approvals
  /api/v1/tenants/{org}/bulk/catalog:pin:
    post:
      operationId: bulkPinCatalog
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkPinCatalogInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Bulk pin catalog items to a version
  /api/v1/tenants/{org}/bulk/clusters:query:
    post:
      operationId: bulkQueryClusters
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkQueryInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Label query across the fleet
  /api/v1/tenants/{org}/bulk/policy:assign:
    post:
      operationId: bulkAssignPolicy
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAssignPolicyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Bulk assign a policy pack to cluster sets
  /api/v1/tenants/{org}/catalog:
    get:
      operationId: listCatalog
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - description: Cluster ID; intersects discovered capabilities
          explode: false
          in: query
          name: cluster
          schema:
            description: Cluster ID; intersects discovered capabilities
            type: string
        - description: Free-text search over name, display name, and description
          explode: false
          in: query
          name: q
          schema:
            description: Free-text search over name, display name, and description
            type: string
        - description: Filter by item source
          explode: false
          in: query
          name: source
          schema:
            description: Filter by item source
            enum:
              - curated
              - discovered
              - platform
              - template
            type: string
        - description: Filter by package category (discovered projections have no category)
          explode: false
          in: query
          name: category
          schema:
            description: Filter by package category (discovered projections have no category)
            type: string
        - description: Sort order (whitelisted server-side)
          explode: false
          in: query
          name: sort
          schema:
            default: name
            description: Sort order (whitelisted server-side)
            enum:
              - name
              - name-desc
              - newest
              - oldest
            type: string
        - description: Page size; 0 returns all matches
          explode: false
          in: query
          name: limit
          schema:
            description: Page size; 0 returns all matches
            format: int64
            maximum: 200
            minimum: 0
            type: integer
        - description: Page offset into the filtered, sorted result
          explode: false
          in: query
          name: offset
          schema:
            description: Page offset into the filtered, sorted result
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCatalogOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List catalog items visible to the tenant (optionally per cluster)
  /api/v1/tenants/{org}/catalog-visibility:
    get:
      operationId: listCatalogVisibility
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
