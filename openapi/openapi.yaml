        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateTeamInputBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: URL-safe team name
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
        role:
          description: Org role the team grants (default viewer)
          type: string
      required:
        - name
      type: object
    CreateTenantInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateTenantInputBody.json
          format: uri
          readOnly: true
          type: string
        displayName:
          maxLength: 200
          minLength: 1
          type: string
        slug:
          description: URL-safe tenant slug
          maxLength: 63
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
      required:
        - slug
        - displayName
      type: object
    DecideExemptionInputBody:
      additionalProperties: false
      properties:
        $schema:
